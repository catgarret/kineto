name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    name: Verify · npm · GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
          registry-url: https://registry.npmjs.org

      - name: Use npm with Trusted Publishing support
        run: npm install --global npm@11

      - name: Validate tag, versions, changelog, and bilingual notes
        run: npm run release:check -- "$GITHUB_REF_NAME"

      - name: Install dependencies
        run: npm ci --prefer-offline --fetch-retries=3 --fetch-retry-mintimeout=1000 --fetch-retry-maxtimeout=5000 --fetch-timeout=30000

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run lint
        run: |
          set -o pipefail
          node scripts/retry-command.mjs npm run lint 2>&1 | tee -a release.log

      - name: Build distributions
        run: |
          set -o pipefail
          node scripts/retry-command.mjs npm run build 2>&1 | tee -a release.log

      - name: Run Node tests
        run: |
          set -o pipefail
          node scripts/retry-command.mjs npm run test:node 2>&1 | tee -a release.log

      - name: Run demo QA
        run: |
          set -o pipefail
          node scripts/retry-command.mjs npm run test:demo 2>&1 | tee -a release.log

      - name: Run browser QA
        run: |
          set -o pipefail
          node scripts/retry-command.mjs npm run test:browser 2>&1 | tee -a release.log

      - name: Pack dry run
        run: |
          set -o pipefail
          node scripts/retry-command.mjs npm pack --dry-run 2>&1 | tee -a release.log

      - name: Run npm audit
        run: |
          set -o pipefail
          node scripts/retry-command.mjs npm audit --audit-level=low 2>&1 | tee -a release.log

      - name: Upload release verification log on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: release-verification-log
          path: release.log
          if-no-files-found: error
          retention-days: 7

      - name: Pack release artifact
        run: npm pack

      - name: Publish package with provenance
        shell: bash
        run: |
          PACKAGE_NAME="$(node -p "require('./package.json').name")"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if npm view "${PACKAGE_NAME}@${PACKAGE_VERSION}" version >/dev/null 2>&1; then
            echo "${PACKAGE_NAME}@${PACKAGE_VERSION} is already published; skipping npm publish."
          else
            npm publish --access public --provenance
          fi

      - name: Refresh jsDelivr latest aliases
        run: npm run purge

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Kineto ${{ github.ref_name }}"
          body_path: ".github/release-notes/${{ github.ref_name }}.md"
          files: "*.tgz"
          generate_release_notes: false
