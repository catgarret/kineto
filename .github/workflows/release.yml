name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    # CI already ran every test on this exact commit (ci.yml, on the push to
    # main). This job does not repeat that: it requires CI's green result for
    # the commit (scripts/require-green-ci.mjs), then checks what it publishes —
    # the built package — and packs the one tarball that npm and the GitHub
    # Release will both receive. About 5 minutes instead of 25, and a flaky
    # test can no longer fail a release that CI already passed.
    name: Verify · green CI · package
    runs-on: ubuntu-24.04
    # Up to 45 minutes of waiting when the tag is pushed while CI still runs.
    timeout-minutes: 60
    permissions:
      contents: read
      # Read the CI runs of this commit; nothing else.
      actions: read

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
          registry-url: https://registry.npmjs.org

      - name: Use npm with Trusted Publishing support
        run: npm install --global npm@11

      - name: Validate tag, versions, changelog, and bilingual notes
        run: npm run release:check -- "$GITHUB_REF_NAME"

      - name: Require green CI for the tagged commit
        run: node scripts/require-green-ci.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Install dependencies
        run: npm ci --prefer-offline --fetch-retries=3 --fetch-retry-mintimeout=1000 --fetch-retry-maxtimeout=5000 --fetch-timeout=30000

      - name: Install Playwright Chromium
        run: timeout --foreground --kill-after=30s 10m npx playwright install --with-deps chromium

      - name: Build distributions
        run: |
          set -o pipefail
          node scripts/retry-command.mjs npm run build 2>&1 | tee -a release.log

      - name: Verify the package
        # package.json `test:release-package`: exports, types, size budgets,
        # the packed tarball, and this workflow's own release rules.
        run: |
          set -o pipefail
          node scripts/run-lane.mjs test:release-package 2>&1 | tee -a release.log
        env:
          # Failing tests leave a public annotation (see tests/ci-annotate.mjs).
          NODE_OPTIONS: --import ${{ github.workspace }}/tests/ci-annotate.mjs

      - name: Smoke-test the built package in Chromium
        # Every public module runs once from the exact build being packed.
        run: |
          set -o pipefail
          node tests/retry-browser-test.mjs tests/browser-smoke.mjs 2>&1 | tee -a release.log
        env:
          NODE_OPTIONS: --import ${{ github.workspace }}/tests/ci-annotate.mjs
          MK_BROWSER_TEST_TIMEOUT: 240000
          MK_BROWSER_TEST_ATTEMPTS: 3

      - name: Pack dry run
        run: |
          set -o pipefail
          node scripts/retry-command.mjs npm pack --dry-run 2>&1 | tee -a release.log

      - name: Audit root and fixture lockfiles
        run: |
          set -o pipefail
          node scripts/retry-command.mjs npm run audit:lockfiles -- --output-dir release-audit 2>&1 | tee -a release.log

      - name: Upload release verification log on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-verification-log
          path: |
            release.log
            release-audit/
          if-no-files-found: error
          retention-days: 7
          overwrite: true

      - name: Pack the verified release artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-artifact
          mapfile -d '' -t existing < <(find release-artifact -mindepth 1 -maxdepth 1 -print0)
          if [ "${#existing[@]}" -ne 0 ]; then
            printf 'Release artifact directory must start empty; found %s files.\n' "${#existing[@]}"
            exit 1
          fi
          npm pack --pack-destination release-artifact
          mapfile -d '' -t tarballs < <(find release-artifact -maxdepth 1 -type f -name '*.tgz' -print0)
          if [ "${#tarballs[@]}" -ne 1 ]; then
            printf 'Expected exactly one package tarball, found %s.\n' "${#tarballs[@]}"
            exit 1
          fi
          tarball="$(basename "${tarballs[0]}")"
          (cd release-artifact && sha256sum -- "$tarball" > "$tarball.sha256")
          mapfile -d '' -t artifacts < <(find release-artifact -mindepth 1 -maxdepth 1 -print0)
          if [ "${#artifacts[@]}" -ne 2 ]; then
            printf 'Expected only the tarball and checksum, found %s files.\n' "${#artifacts[@]}"
            exit 1
          fi

      - name: Upload the verified package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-package-${{ github.ref_name }}
          path: release-artifact/
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  publish:
    name: Publish verified npm and GitHub artifacts
    needs: [verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
          registry-url: https://registry.npmjs.org

      - name: Use npm with Trusted Publishing support
        run: npm install --global npm@11

      - name: Download the verified package
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: verified-package-${{ github.ref_name }}
          path: release-artifact

      - name: Verify artifact digest
        id: verified_artifact
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' -t artifacts < <(find release-artifact -mindepth 1 -maxdepth 1 -print0)
          mapfile -d '' -t tarballs < <(find release-artifact -maxdepth 1 -type f -name '*.tgz' -print0)
          mapfile -d '' -t checksums < <(find release-artifact -maxdepth 1 -type f -name '*.sha256' -print0)
          if [ "${#artifacts[@]}" -ne 2 ] || [ "${#tarballs[@]}" -ne 1 ] || [ "${#checksums[@]}" -ne 1 ]; then
            printf 'Expected only one tarball and one checksum; found %s total, %s tarballs, and %s checksums.\n' "${#artifacts[@]}" "${#tarballs[@]}" "${#checksums[@]}"
            exit 1
          fi
          tarball="${tarballs[0]}"
          checksum="${checksums[0]}"
          if [ "$checksum" != "$tarball.sha256" ]; then
            printf 'Checksum file %s does not belong to %s.\n' "$checksum" "$tarball"
            exit 1
          fi
          (cd release-artifact && sha256sum --check --strict -- "$(basename "$checksum")")
          # npm treats an unprefixed "owner/repo"-shaped value as a Git spec.
          # Keep the verified artifact explicitly relative for every consumer.
          printf 'tarball=./%s\n' "$tarball" >> "$GITHUB_OUTPUT"

      - name: Publish package with provenance
        shell: bash
        env:
          RELEASE_TARBALL: ${{ steps.verified_artifact.outputs.tarball }}
        run: |
          set -euo pipefail
          PACKAGE_NAME="$(node -p "require('./package.json').name")"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          test -f "$RELEASE_TARBALL"
          TARBALL_INTEGRITY="sha512-$(node -e 'const { createHash } = require("node:crypto"); const { readFileSync } = require("node:fs"); process.stdout.write(createHash("sha512").update(readFileSync(process.argv[1])).digest("base64"));' "$RELEASE_TARBALL")"
          if PUBLISHED_INTEGRITY="$(npm view "${PACKAGE_NAME}@${PACKAGE_VERSION}" dist.integrity 2>/dev/null)"; then
            if [ "$PUBLISHED_INTEGRITY" != "$TARBALL_INTEGRITY" ]; then
              echo "Published package integrity does not match the verified release tarball."
              exit 1
            fi
            echo "${PACKAGE_NAME}@${PACKAGE_VERSION} is already published; skipping npm publish."
          else
            npm publish "$RELEASE_TARBALL" --access public --provenance
          fi

      - name: Refresh jsDelivr latest aliases
        run: npm run purge

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TARBALL: ${{ steps.verified_artifact.outputs.tarball }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "GitHub Release $GITHUB_REF_NAME already exists; leaving the immutable release unchanged."
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "Kineto $GITHUB_REF_NAME" \
              --notes-file ".github/release-notes/$GITHUB_REF_NAME.md" \
              "$RELEASE_TARBALL"
          fi
