name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Verify · Chromium · package
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          package-manager-cache: false
          registry-url: https://registry.npmjs.org

      - name: Use npm with Trusted Publishing support
        run: npm install --global npm@11

      - name: Validate tag, versions, changelog, and bilingual notes
        run: npm run release:check -- "$GITHUB_REF_NAME"

      - name: Install dependencies
        run: npm ci --prefer-offline --fetch-retries=3 --fetch-retry-mintimeout=1000 --fetch-retry-maxtimeout=5000 --fetch-timeout=30000

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run lint
        run: |
          set -o pipefail
          node scripts/retry-command.mjs npm run lint 2>&1 | tee -a release.log

      - name: Build distributions
        run: |
          set -o pipefail
          node scripts/retry-command.mjs npm run build 2>&1 | tee -a release.log

      - name: Run Node tests · contracts and package
        run: |
          set -euo pipefail
          for command in test:utils test:diagnostics test:states test:presence test:contract test:requirements test:docs test:docs-navigation test:roadmap-readiness test:readiness-gates test:readiness-evidence test:lockfile-boundary test:supply-chain-automation test:module-metadata test:module-status test:mobile-device-manifest test:package test:types test:package-size test:package-tarball; do
            echo "::group::$command"
            node scripts/retry-command.mjs npm run "$command" 2>&1 | tee -a release.log
            echo "::endgroup::"
          done

      - name: Run Node tests · consumers and frameworks
        run: |
          set -euo pipefail
          for command in test:consumer-bundles test:framework; do
            echo "::group::$command"
            node scripts/retry-command.mjs npm run "$command" 2>&1 | tee -a release.log
            echo "::endgroup::"
          done

      - name: Run Node tests · demo surface
        run: |
          set -euo pipefail
          for command in test:parity test:structure test:copy test:lazy test:options test:variants test:help test:inline test:defaults test:variant-options test:variant-distinctness; do
            echo "::group::$command"
            node scripts/retry-command.mjs npm run "$command" 2>&1 | tee -a release.log
            echo "::endgroup::"
          done

      - name: Run Node tests · runtime regressions
        run: |
          set -uo pipefail
          failures=()
          for command in test:easings test:reduced test:update test:audit test:leak test:perf test:deps test:engine test:sequence-sources test:regressions; do
            echo "::group::$command"
            if ! node scripts/retry-command.mjs npm run "$command" 2>&1 | tee -a release.log; then
              echo "::error title=Node runtime test failed::$command"
              failures+=("$command")
            fi
            echo "::endgroup::"
          done
          if ((${#failures[@]})); then
            printf 'Node runtime test failures: %s\n' "${failures[*]}"
            exit 1
          fi

      - name: Run Node tests · site and release
        run: |
          set -uo pipefail
          failures=()
          for command in test:site test:release test:size; do
            echo "::group::$command"
            if ! node scripts/retry-command.mjs npm run "$command" 2>&1 | tee -a release.log; then
              echo "::error title=Site/release test failed::$command"
              failures+=("$command")
            fi
            echo "::endgroup::"
          done
          if ((${#failures[@]})); then
            printf 'Site/release test failures: %s\n' "${failures[*]}"
            exit 1
          fi

      - name: Run demo QA
        run: |
          set -o pipefail
          node scripts/retry-command.mjs npm run test:demo 2>&1 | tee -a release.log

      - name: Run browser QA
        run: |
          set -o pipefail
          if ! node scripts/retry-command.mjs npm run test:browser 2>&1 | tee -a release.log; then
            echo "::error title=Browser QA failed::test:browser"
            exit 1
          fi
        env:
          # Match the full CI lane: hosted Chromium can need more time than a
          # local run while still remaining a bounded release gate.
          MK_BROWSER_TEST_TIMEOUT: 240000
          MK_BROWSER_TEST_ATTEMPTS: 3

      - name: Pack dry run
        run: |
          set -o pipefail
          node scripts/retry-command.mjs npm pack --dry-run 2>&1 | tee -a release.log

      - name: Audit root and fixture lockfiles
        run: |
          set -o pipefail
          node scripts/retry-command.mjs npm run audit:lockfiles -- --output-dir release-audit 2>&1 | tee -a release.log

      - name: Upload release verification log on failure
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-verification-log
          path: |
            release.log
            release-audit/
          if-no-files-found: error
          retention-days: 7
          overwrite: true

      - name: Pack the verified release artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-artifact
          mapfile -d '' -t existing < <(find release-artifact -mindepth 1 -maxdepth 1 -print0)
          if [ "${#existing[@]}" -ne 0 ]; then
            printf 'Release artifact directory must start empty; found %s files.\n' "${#existing[@]}"
            exit 1
          fi
          npm pack --pack-destination release-artifact
          mapfile -d '' -t tarballs < <(find release-artifact -maxdepth 1 -type f -name '*.tgz' -print0)
          if [ "${#tarballs[@]}" -ne 1 ]; then
            printf 'Expected exactly one package tarball, found %s.\n' "${#tarballs[@]}"
            exit 1
          fi
          tarball="$(basename "${tarballs[0]}")"
          (cd release-artifact && sha256sum -- "$tarball" > "$tarball.sha256")
          mapfile -d '' -t artifacts < <(find release-artifact -mindepth 1 -maxdepth 1 -print0)
          if [ "${#artifacts[@]}" -ne 2 ]; then
            printf 'Expected only the tarball and checksum, found %s files.\n' "${#artifacts[@]}"
            exit 1
          fi

      - name: Upload the verified package
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: verified-package-${{ github.ref_name }}
          path: release-artifact/
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  cross-browser:
    name: ${{ matrix.browser }} · release gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        browser: [firefox, webkit]

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --prefer-offline --fetch-retries=3 --fetch-retry-mintimeout=1000 --fetch-retry-maxtimeout=5000 --fetch-timeout=30000

      - name: Install Playwright ${{ matrix.browser }}
        shell: bash
        run: |
          set -o pipefail
          if [ "${{ matrix.browser }}" = "webkit" ]; then
            timeout --foreground --kill-after=30s 10m npx playwright install --with-deps webkit
          else
            node scripts/retry-command.mjs timeout --signal=TERM 5m npx playwright install firefox
          fi

      - name: Build distributions
        run: npm run build

      - name: Run cross-browser release QA
        shell: bash
        run: |
          set -o pipefail
          node tests/retry-browser-test.mjs tests/browser-smoke.mjs 2>&1 | tee -a release-${{ matrix.browser }}.log
          node tests/retry-browser-test.mjs tests/browser/demo-polish.mjs 2>&1 | tee -a release-${{ matrix.browser }}.log
        env:
          KT_BROWSER: ${{ matrix.browser }}
          MK_BROWSER_TEST_TIMEOUT: 240000
          MK_BROWSER_TEST_ATTEMPTS: ${{ matrix.browser == 'webkit' && 4 || 3 }}

      - name: Upload cross-browser artifacts on failure
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-${{ matrix.browser }}-artifacts
          path: |
            release-${{ matrix.browser }}.log
            tests/browser/shots/
            tests/.smoke/
          if-no-files-found: ignore
          retention-days: 7
          overwrite: true

  publish:
    name: Publish verified npm and GitHub artifacts
    needs: [verify, cross-browser]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          package-manager-cache: false
          registry-url: https://registry.npmjs.org

      - name: Use npm with Trusted Publishing support
        run: npm install --global npm@11

      - name: Download the verified package
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: verified-package-${{ github.ref_name }}
          path: release-artifact

      - name: Verify artifact digest
        id: verified_artifact
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' -t artifacts < <(find release-artifact -mindepth 1 -maxdepth 1 -print0)
          mapfile -d '' -t tarballs < <(find release-artifact -maxdepth 1 -type f -name '*.tgz' -print0)
          mapfile -d '' -t checksums < <(find release-artifact -maxdepth 1 -type f -name '*.sha256' -print0)
          if [ "${#artifacts[@]}" -ne 2 ] || [ "${#tarballs[@]}" -ne 1 ] || [ "${#checksums[@]}" -ne 1 ]; then
            printf 'Expected only one tarball and one checksum; found %s total, %s tarballs, and %s checksums.\n' "${#artifacts[@]}" "${#tarballs[@]}" "${#checksums[@]}"
            exit 1
          fi
          tarball="${tarballs[0]}"
          checksum="${checksums[0]}"
          if [ "$checksum" != "$tarball.sha256" ]; then
            printf 'Checksum file %s does not belong to %s.\n' "$checksum" "$tarball"
            exit 1
          fi
          (cd release-artifact && sha256sum --check --strict -- "$(basename "$checksum")")
          printf 'tarball=%s\n' "$tarball" >> "$GITHUB_OUTPUT"

      - name: Publish package with provenance
        shell: bash
        env:
          RELEASE_TARBALL: ${{ steps.verified_artifact.outputs.tarball }}
        run: |
          set -euo pipefail
          PACKAGE_NAME="$(node -p "require('./package.json').name")"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          test -f "$RELEASE_TARBALL"
          TARBALL_INTEGRITY="sha512-$(node -e 'const { createHash } = require("node:crypto"); const { readFileSync } = require("node:fs"); process.stdout.write(createHash("sha512").update(readFileSync(process.argv[1])).digest("base64"));' "$RELEASE_TARBALL")"
          if PUBLISHED_INTEGRITY="$(npm view "${PACKAGE_NAME}@${PACKAGE_VERSION}" dist.integrity 2>/dev/null)"; then
            if [ "$PUBLISHED_INTEGRITY" != "$TARBALL_INTEGRITY" ]; then
              echo "Published package integrity does not match the verified release tarball."
              exit 1
            fi
            echo "${PACKAGE_NAME}@${PACKAGE_VERSION} is already published; skipping npm publish."
          else
            npm publish "$RELEASE_TARBALL" --access public --provenance
          fi

      - name: Refresh jsDelivr latest aliases
        run: npm run purge

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TARBALL: ${{ steps.verified_artifact.outputs.tarball }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "GitHub Release $GITHUB_REF_NAME already exists; leaving the immutable release unchanged."
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "Kineto $GITHUB_REF_NAME" \
              --notes-file ".github/release-notes/$GITHUB_REF_NAME.md" \
              "$RELEASE_TARBALL"
          fi
