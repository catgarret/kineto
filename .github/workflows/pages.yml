name: Deploy demo site

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only real deploys (main pushes, manual dispatch) share the group, so a newer
# main build supersedes an older one. Every other CI completion (Dependabot and
# pull-request branches, failed runs) is skipped by the job condition below and
# must not enter the group: on 2026-09-19 such a skipped run cancelled the
# v0.10.0 deploy ("a higher priority waiting request for demo-site exists") and
# the live site stayed on the previous build.
concurrency:
  group: demo-site-${{ (github.event_name == 'workflow_dispatch' || (github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main')) && 'main' || github.run_id }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy Kineto demo to GitHub Pages
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.conclusion == 'success')
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout verified Kineto source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Build deployable demo
        run: |
          npm ci
          npm run build
          npm run test:site

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Upload demo artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

      - name: Verify canonical live site
        env:
          KT_EXPECTED_BUILD: ${{ github.event.workflow_run.head_sha || github.sha }}
          KT_LIVE_ATTEMPTS: 24
        run: npm run test:live-site
