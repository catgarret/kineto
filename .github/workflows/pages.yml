name: Deploy demo site

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: demo-site
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy Kineto demo to GitHub Pages
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.head_branch == 'main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout verified Kineto source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Wait for the triggering CI run
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
          CI_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          for attempt in $(seq 1 60); do
            state="$(gh run view "$CI_RUN_ID" --json status,conclusion --jq '[.status, (.conclusion // "")] | @tsv')"
            status="${state%%$'\t'*}"
            conclusion="${state#*$'\t'}"
            echo "CI run $CI_RUN_ID: status=$status conclusion=${conclusion:-pending} (poll $attempt/60)"
            if [ "$status" = completed ]; then
              [ "$conclusion" = success ] && exit 0
              echo "The triggering CI run did not succeed."
              exit 1
            fi
            sleep 10
          done
          echo "Timed out waiting for the triggering CI run."
          exit 1

      - name: Build deployable demo
        run: |
          npm ci
          npm run build
          npm run test:site

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload demo artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify canonical live site
        run: npm run test:live-site
