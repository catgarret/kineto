name: Supply-chain audit

on:
  schedule:
    - cron: "41 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supply-chain-audit
  cancel-in-progress: true

jobs:
  audit:
    name: Lockfile, audit, and package boundary
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --prefer-offline --fetch-retries=3 --fetch-retry-mintimeout=1000 --fetch-retry-maxtimeout=5000 --fetch-timeout=30000

      - name: Check lockfile registry boundary
        run: npm run test:lockfile-boundary

      - name: Audit root and fixture lockfiles
        id: lockfile_audit
        continue-on-error: true
        run: npm run audit:lockfiles -- --output-dir artifacts

      - name: Generate SPDX SBOM
        if: always()
        run: |
          mkdir -p artifacts
          npm sbom --sbom-format=spdx > artifacts/kineto-sbom.spdx.json

      - name: Check package surface
        if: always()
        run: |
          npm run test:package-size
          npm run test:package-tarball

      - name: Upload supply-chain reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: supply-chain-reports
          path: artifacts/
          if-no-files-found: error
          retention-days: 14

      - name: Fail on audit findings or audit errors
        if: always() && steps.lockfile_audit.outcome == 'failure'
        run: exit 1
