name: CI

on:
  push:
    branches:
      - main
      - master
      - "codex/**"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Node 24 / npm 11 · full test suite
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Use npm with Trusted Publishing support
        run: npm install --global npm@11

      - name: Install dependencies
        run: npm ci --prefer-offline --fetch-retries=3 --fetch-retry-mintimeout=1000 --fetch-retry-maxtimeout=5000 --fetch-timeout=30000

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run lint
        run: |
          set -o pipefail
          node scripts/retry-command.mjs npm run lint 2>&1 | tee -a ci.log

      - name: Build distributions
        run: |
          set -o pipefail
          node scripts/retry-command.mjs npm run build 2>&1 | tee -a ci.log

      - name: Run Node tests
        run: |
          set -o pipefail
          node scripts/retry-command.mjs npm run test:node 2>&1 | tee -a ci.log

      - name: Run demo QA
        run: |
          set -o pipefail
          node scripts/retry-command.mjs npm run test:demo 2>&1 | tee -a ci.log

      - name: Run browser QA
        run: |
          set -o pipefail
          node scripts/retry-command.mjs npm run test:browser 2>&1 | tee -a ci.log

      - name: Pack dry run
        run: |
          set -o pipefail
          node scripts/retry-command.mjs npm pack --dry-run 2>&1 | tee -a ci.log

      - name: Upload browser screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: browser-test-artifacts
          path: |
            ci.log
            tests/browser/shots/
            tests/.smoke/
          if-no-files-found: ignore
          retention-days: 7

  cross-browser:
    name: ${{ matrix.browser }} · browser smoke
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Use npm with Trusted Publishing support
        run: npm install --global npm@11

      - name: Install dependencies
        run: npm ci --prefer-offline --fetch-retries=3 --fetch-retry-mintimeout=1000 --fetch-retry-maxtimeout=5000 --fetch-timeout=30000

      - name: Install Playwright ${{ matrix.browser }}
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Build distributions
        run: npm run build

      - name: Run cross-browser smoke
        run: node tests/retry-browser-test.mjs tests/browser-smoke.mjs
        env:
          KT_BROWSER: ${{ matrix.browser }}
