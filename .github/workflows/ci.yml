name: CI

on:
  push:
    branches:
      - main
      - master
      - "codex/**"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Node 24 / npm 11 · full test suite
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Use npm with Trusted Publishing support
        run: npm install --global npm@11

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run lint, build, Node and browser tests
        run: npm run ci

      - name: Upload browser screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: browser-test-artifacts
          path: |
            tests/browser/shots/
            tests/.smoke/
          if-no-files-found: ignore
          retention-days: 7

  cross-browser:
    name: ${{ matrix.browser }} · browser smoke
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Use npm with Trusted Publishing support
        run: npm install --global npm@11

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright ${{ matrix.browser }}
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Build distributions
        run: npm run build

      - name: Run cross-browser smoke
        run: node tests/retry-browser-test.mjs tests/browser-smoke.mjs
        env:
          KT_BROWSER: ${{ matrix.browser }}
