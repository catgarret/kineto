name: CI

on:
  push:
    branches:
      - main
      - master
      - "codex/**"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  node-compatibility:
    name: Node ${{ matrix.node }} · public engine contract
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ["20.19.0", "22.12.0"]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --prefer-offline --fetch-retries=3 --fetch-retry-mintimeout=1000 --fetch-retry-maxtimeout=5000 --fetch-timeout=30000

      - name: Build and verify the public runtime contract
        run: |
          set -euo pipefail
          npm run build
          npm run test:utils
          npm run test:states
          npm run test:observe
          npm run test:presence
          npm run test:package
          npm run test:types
          npm run test:package-tarball
          npm pack --dry-run

  test:
    name: Node 24 / npm 11 · lint, build, Node and demo QA
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Use npm with Trusted Publishing support
        run: npm install --global npm@11

      - name: Install dependencies
        run: npm ci --prefer-offline --fetch-retries=3 --fetch-retry-mintimeout=1000 --fetch-retry-maxtimeout=5000 --fetch-timeout=30000

      - name: Install Playwright Chromium
        run: |
          set -o pipefail
          # Demo QA and the integration fixtures drive Chromium. Bound apt/browser
          # provisioning so a mirror stall cannot consume the whole job.
          timeout --foreground --kill-after=30s 10m npx playwright install --with-deps chromium

      - name: Run lint
        run: |
          set -o pipefail
          node scripts/retry-command.mjs npm run lint 2>&1 | tee -a ci.log

      - name: Build distributions
        run: |
          set -o pipefail
          node scripts/retry-command.mjs npm run build 2>&1 | tee -a ci.log

      - name: Run Node tests
        # package.json `test:node` is the one list; run-lane runs every step,
        # retries a failing one on its own, and reports all failures at once.
        run: |
          set -o pipefail
          node scripts/run-lane.mjs test:node 2>&1 | tee -a ci.log
        env:
          # Failing tests leave a public annotation (see tests/ci-annotate.mjs).
          NODE_OPTIONS: --import ${{ github.workspace }}/tests/ci-annotate.mjs
          KT_COMMAND_ATTEMPTS: 2

      - name: Run demo QA
        run: |
          set -o pipefail
          node scripts/retry-command.mjs npm run test:demo 2>&1 | tee -a ci.log
        env:
          # Failing tests leave a public annotation (see tests/ci-annotate.mjs).
          NODE_OPTIONS: --import ${{ github.workspace }}/tests/ci-annotate.mjs

      - name: Pack dry run
        run: |
          set -o pipefail
          node scripts/retry-command.mjs npm pack --dry-run 2>&1 | tee -a ci.log

      - name: Upload the log on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: node-test-log
          path: |
            ci.log
            tests/.smoke/
          if-no-files-found: ignore
          retention-days: 7
          overwrite: true

  browser:
    name: ${{ matrix.browser }} · ${{ matrix.lane }} · ${{ matrix.shard }}
    # Every entry gets its own hosted runner and none waits for another job, so
    # CI takes as long as the slowest shard instead of the sum of all lanes
    # (about 25 minutes when Chromium, WebKit and Firefox ran one after another).
    # A lane is split with `run-lane --shard k/n` (round-robin by position in
    # package.json), so no test list is repeated here. To rebalance, change a
    # shard count below and list every k of n. The demo deploys only when every
    # job passes (pages.yml).
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { browser: chromium, lane: "test:browser", shard: "1/2" }
          - { browser: chromium, lane: "test:browser", shard: "2/2" }
          - { browser: webkit, lane: "test:browser:cross", shard: "1/2" }
          - { browser: webkit, lane: "test:browser:cross", shard: "2/2" }
          - { browser: firefox, lane: "test:browser:cross", shard: "1/1" }

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --prefer-offline --fetch-retries=3 --fetch-retry-mintimeout=1000 --fetch-retry-maxtimeout=5000 --fetch-timeout=30000

      - name: Install Playwright ${{ matrix.browser }}
        env:
          BROWSER: ${{ matrix.browser }}
        run: |
          set -o pipefail
          # Firefox runs with the hosted runner's libraries. Chromium and WebKit
          # need extra runtime packages; bound that apt/browser provisioning so a
          # mirror stall cannot consume the job.
          if [ "$BROWSER" = "firefox" ]; then
            node scripts/retry-command.mjs timeout --signal=TERM 5m npx playwright install firefox
          else
            timeout --foreground --kill-after=30s 10m npx playwright install --with-deps "$BROWSER"
          fi

      - name: Build distributions
        run: npm run build

      - name: Run browser lane
        env:
          # Failing tests leave a public annotation (see tests/ci-annotate.mjs).
          NODE_OPTIONS: --import ${{ github.workspace }}/tests/ci-annotate.mjs
          KT_BROWSER: ${{ matrix.browser }}
          LANE: ${{ matrix.lane }}
          SHARD: ${{ matrix.shard }}
          # Per test: at most 240s per attempt. A test that passes only on a
          # retry is reported as flaky (annotation), never silently.
          MK_BROWSER_TEST_TIMEOUT: 240000
          MK_BROWSER_TEST_ATTEMPTS: ${{ matrix.browser == 'webkit' && 4 || 3 }}
        run: |
          set -o pipefail
          node scripts/run-lane.mjs "$LANE" --shard "$SHARD" 2>&1 | tee -a browser.log

      - name: Upload browser artifacts on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # A shard like "1/2" cannot be part of an artifact name; the job index can.
          name: browser-${{ matrix.browser }}-${{ strategy.job-index }}
          path: |
            browser.log
            tests/browser/shots/
            tests/.smoke/
          if-no-files-found: ignore
          retention-days: 7
          overwrite: true
