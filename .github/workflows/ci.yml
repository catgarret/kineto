name: CI

on:
  push:
    branches:
      - main
      - master
      - "codex/**"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Node 24 / npm 11 · full test suite
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Use npm with Trusted Publishing support
        run: npm install --global npm@11

      - name: Install dependencies
        run: npm ci --prefer-offline --fetch-retries=3 --fetch-retry-mintimeout=1000 --fetch-retry-maxtimeout=5000 --fetch-timeout=30000

      - name: Install Playwright Chromium
        run: |
          set -o pipefail
          # Chromium's full browser QA needs the runner libraries as well as
          # the binary. Bound apt/browser provisioning so a mirror stall cannot
          # consume the whole test job.
          timeout --foreground --kill-after=30s 10m npx playwright install --with-deps chromium

      - name: Run lint
        run: |
          set -o pipefail
          node scripts/retry-command.mjs npm run lint 2>&1 | tee -a ci.log

      - name: Build distributions
        run: |
          set -o pipefail
          node scripts/retry-command.mjs npm run build 2>&1 | tee -a ci.log

      - name: Run Node tests · contracts and package
        run: |
          set -euo pipefail
          for command in test:utils test:diagnostics test:states test:presence test:contract test:requirements test:docs test:docs-navigation test:roadmap-readiness test:readiness-gates test:readiness-evidence test:lockfile-boundary test:supply-chain-automation test:module-metadata test:module-status test:mobile-device-manifest test:package test:types test:package-size test:package-tarball; do
            echo "::group::$command"
            node scripts/retry-command.mjs npm run "$command" 2>&1 | tee -a ci.log
            echo "::endgroup::"
          done

      - name: Run Node tests · consumers and frameworks
        run: |
          set -uo pipefail
          failures=()
          for command in test:consumer-bundles test:framework; do
            echo "::group::$command"
            if ! node scripts/retry-command.mjs npm run "$command" 2>&1 | tee -a ci.log; then
              echo "::error title=Consumer/framework test failed::$command"
              failures+=("$command")
            fi
            echo "::endgroup::"
          done
          if ((${#failures[@]})); then
            printf 'Consumer/framework test failures: %s\n' "${failures[*]}"
            exit 1
          fi

      - name: Run Node tests · demo surface
        run: |
          set -euo pipefail
          for command in test:parity test:structure test:copy test:lazy test:options test:variants test:help test:inline test:defaults test:variant-options test:variant-distinctness; do
            echo "::group::$command"
            node scripts/retry-command.mjs npm run "$command" 2>&1 | tee -a ci.log
            echo "::endgroup::"
          done

      - name: Run Node tests · runtime regressions
        run: |
          set -uo pipefail
          failures=()
          for command in test:easings test:reduced test:update test:audit test:leak test:perf test:deps test:engine test:sequence-sources test:regressions; do
            echo "::group::$command"
            if ! node scripts/retry-command.mjs npm run "$command" 2>&1 | tee -a ci.log; then
              echo "::error title=Node runtime test failed::$command"
              failures+=("$command")
            fi
            echo "::endgroup::"
          done
          if ((${#failures[@]})); then
            printf 'Node runtime test failures: %s\n' "${failures[*]}"
            exit 1
          fi

      - name: Run Node tests · site and release
        run: |
          set -uo pipefail
          failures=()
          for command in test:site test:release test:size; do
            echo "::group::$command"
            if ! node scripts/retry-command.mjs npm run "$command" 2>&1 | tee -a ci.log; then
              echo "::error title=Site/release test failed::$command"
              failures+=("$command")
            fi
            echo "::endgroup::"
          done
          if ((${#failures[@]})); then
            printf 'Site/release test failures: %s\n' "${failures[*]}"
            exit 1
          fi

      - name: Run demo QA
        run: |
          set -o pipefail
          node scripts/retry-command.mjs npm run test:demo 2>&1 | tee -a ci.log

      - name: Run browser QA
        run: |
          set -o pipefail
          if ! node scripts/retry-command.mjs npm run test:browser 2>&1 | tee -a ci.log; then
            echo "::error title=Browser QA failed::test:browser"
            exit 1
          fi
        env:
          # The full Chromium lane exercises every playground and can spend
          # longer than the cross-browser smoke lane on a shared runner. Keep
          # the retry bounded while allowing a complete attempt to finish.
          MK_BROWSER_TEST_TIMEOUT: 240000
          # WebKit's hosted runner occasionally loses one full-demo attempt
          # while provisioning its isolated process. Keep the existing
          # bounded timeout and allow one additional clean process group only
          # for that engine; assertions still fail the job after all attempts.
          MK_BROWSER_TEST_ATTEMPTS: ${{ matrix.browser == 'webkit' && 4 || 3 }}

      - name: Pack dry run
        run: |
          set -o pipefail
          node scripts/retry-command.mjs npm pack --dry-run 2>&1 | tee -a ci.log

      - name: Upload browser screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: browser-test-artifacts
          path: |
            ci.log
            tests/browser/shots/
            tests/.smoke/
          if-no-files-found: ignore
          retention-days: 7

  cross-browser:
    name: ${{ matrix.browser }} · browser smoke
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      # WebKit and Firefox share the same CPU/memory-heavy demo fixture. Keep
      # the engines isolated on the hosted runner so one lane cannot starve
      # the other while the full demo-polish suite is booting.
      max-parallel: 1
      matrix:
        browser: [firefox, webkit]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Use npm with Trusted Publishing support
        run: npm install --global npm@11

      - name: Install dependencies
        run: npm ci --prefer-offline --fetch-retries=3 --fetch-retry-mintimeout=1000 --fetch-retry-maxtimeout=5000 --fetch-timeout=30000

      - name: Install Playwright ${{ matrix.browser }}
        run: |
          set -o pipefail
          # Firefox runs with the hosted runner's libraries. WebKit needs its
          # additional runtime packages; bound that apt/browser provisioning so
          # a mirror stall cannot consume the whole matrix job.
          if [ "${{ matrix.browser }}" = "webkit" ]; then
            timeout --foreground --kill-after=30s 10m npx playwright install --with-deps webkit
          else
            node scripts/retry-command.mjs timeout --signal=TERM 5m npx playwright install firefox
          fi

      - name: Build distributions
        run: npm run build

      - name: Run cross-browser smoke
        run: |
          set -o pipefail
          node tests/retry-browser-test.mjs tests/browser-smoke.mjs 2>&1 | tee -a cross-browser-${{ matrix.browser }}.log
        env:
          KT_BROWSER: ${{ matrix.browser }}

      - name: Run full demo regression QA in the cross-browser lane
        if: matrix.browser == 'firefox' || matrix.browser == 'webkit'
        run: |
          set -o pipefail
          node tests/retry-browser-test.mjs tests/browser/demo-polish.mjs 2>&1 | tee -a cross-browser-${{ matrix.browser }}.log
        env:
          KT_BROWSER: ${{ matrix.browser }}
          MK_BROWSER_TEST_TIMEOUT: 240000
          MK_BROWSER_TEST_ATTEMPTS: 3

      - name: Upload cross-browser artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: cross-browser-${{ matrix.browser }}-artifacts
          path: |
            cross-browser-${{ matrix.browser }}.log
            tests/browser/shots/
            tests/.smoke/
          if-no-files-found: ignore
          retention-days: 7
