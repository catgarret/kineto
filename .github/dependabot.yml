version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:41"
      timezone: Asia/Seoul
    open-pull-requests-limit: 5
    versioning-strategy: increase-if-necessary

  - package-ecosystem: npm
    directory: /tests/consumer-bundles
    schedule:
      interval: weekly
      day: monday
      time: "04:51"
      timezone: Asia/Seoul
    open-pull-requests-limit: 5
    versioning-strategy: increase-if-necessary

  - package-ecosystem: npm
    directory: /tests/framework-qa
    schedule:
      interval: weekly
      day: monday
      time: "05:01"
      timezone: Asia/Seoul
    open-pull-requests-limit: 5
    versioning-strategy: increase-if-necessary

  - package-ecosystem: npm
    directory: /tests/integrations
    schedule:
      interval: weekly
      day: monday
      time: "05:06"
      timezone: Asia/Seoul
    open-pull-requests-limit: 5
    versioning-strategy: increase-if-necessary
    # The fixture pins the UI-library majors the integration map documents
    # (MUI 7, Mantine 8, Chakra 3, antd 5, Vuetify 3, PrimeVue 4, shadcn 3,
    # Bootstrap 5). A new major changes the attachment claims and is reviewed
    # by hand (docs + tests together), not by an automatic bump that fails CI.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /packages/kineto-mcp
    schedule:
      interval: weekly
      day: monday
      time: "05:11"
      timezone: Asia/Seoul
    open-pull-requests-limit: 5
    versioning-strategy: increase-if-necessary

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:11"
      timezone: Asia/Seoul
    open-pull-requests-limit: 5
