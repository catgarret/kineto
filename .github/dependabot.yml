version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:41"
      timezone: Asia/Seoul
    open-pull-requests-limit: 5
    versioning-strategy: increase-if-necessary

  - package-ecosystem: npm
    directory: /tests/consumer-bundles
    schedule:
      interval: weekly
      day: monday
      time: "04:51"
      timezone: Asia/Seoul
    open-pull-requests-limit: 5
    versioning-strategy: increase-if-necessary

  - package-ecosystem: npm
    directory: /tests/framework-qa
    schedule:
      interval: weekly
      day: monday
      time: "05:01"
      timezone: Asia/Seoul
    open-pull-requests-limit: 5
    versioning-strategy: increase-if-necessary

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:11"
      timezone: Asia/Seoul
    open-pull-requests-limit: 5
